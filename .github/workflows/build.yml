name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android Folder
        run: flutter create --project-name ptt_tactical .
      - name: Upgrade Android Min SDK for Audio
        run: sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
      - name: Download Packages
        run: flutter pub get
      - name: Compile APK
        run: flutter build apk --release
      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: TACTICAL-PTT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
